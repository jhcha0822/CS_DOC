spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

# multipart 요청당 part 개수 상한 (기본 50). md + 이미지 다수 선택 시 초과 방지
server:
  tomcat:
    max-part-count: 500

logging:
  level:
    org.hibernate.SQL: debug

# CS_DOC_BASE_DIR: 프로젝트 데이터 루트의 상위 디렉터리 (CS_DOC git root보다 한 단계 위 권장)
# - 기본값: D:\Project (현재 PC)
# - 다른 PC에서 사용 시: 환경변수 CS_DOC_BASE_DIR=원하는경로 설정
app:
  storage:
    base-dir: ${CS_DOC_BASE_DIR:D:\\Project}
    md-root: ${app.storage.base-dir}/CS_DOC_DATA/md
    upload-dir: ${app.storage.base-dir}/CS_DOC_DATA/uploads