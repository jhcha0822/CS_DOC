spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

# multipart 요청당 part 개수 상한 (기본 50). md + 이미지 다수 선택 시 초과 방지
server:
  tomcat:
    max-part-count: 500

logging:
  level:
    org.hibernate.SQL: debug

app:
  storage:
    md-root: C:\Users\Kingdomcome\Documents\CS_DOC_DATA\md
    upload-dir: C:\Users\Kingdomcome\Documents\CS_DOC_DATA\uploads