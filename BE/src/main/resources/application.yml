# 기본 프로파일: 실제 운용(prod). test 프로파일은 보류(필요 시 --spring.profiles.active=test 로 실행)
spring:
  profiles:
    active: prod
  jpa:
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: validate
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

# multipart 요청당 part 개수 상한 (기본 50). md + 이미지 다수 선택 시 초과 방지
server:
  tomcat:
    max-part-count: 500

logging:
  level:
    org.hibernate.SQL: debug

# === 환경별 경로 설정 (노트북 / 사내 PC / NAS 등) ===
# CS_DOC_BASE_DIR: 데이터 루트의 상위 디렉터리. 미설정 시 아래 기본값 사용.
# - 노트북: 기본값 user.home/Documents (예: C:\Users\사용자명\Documents)
# - 사내 PC: 환경변수 예) set CS_DOC_BASE_DIR=D:\Project
# - NAS 운영: 환경변수 예) set CS_DOC_BASE_DIR=\\NAS\share\CS_DOC
# - JVM 옵션으로 지정: -DCS_DOC_BASE_DIR=원하는경로
app:
  # 파일 로그 저장 경로 (기본값은 ${app.storage.base-dir}/CS_DOC_DATA/logs)
  logging:
    dir: ${APP_LOG_DIR:${app.storage.base-dir}/CS_DOC_DATA/logs}
  storage:
    base-dir: ${CS_DOC_BASE_DIR:${user.home}/Documents}
    md-root: ${app.storage.base-dir}/CS_DOC_DATA/md
    upload-dir: ${app.storage.base-dir}/CS_DOC_DATA/uploads
  # TSS 에이전트 (FE는 /api/tss-agent/respond 로만 호출 → 서버에서 전달, CORS·정적서버 무관)
  tss-agent:
    base-url: ${TSS_AGENT_BASE_URL:http://192.168.100.114:28080}